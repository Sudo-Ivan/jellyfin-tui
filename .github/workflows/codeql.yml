name: CodeQL Analysis

run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('Manual scan by @{0}{1}', github.actor, inputs.reason != '' && format(' ({0})', inputs.reason) || '')
      || github.event.pull_request.title
      || github.event.head_commit.message
      || 'Scheduled scan' }}

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "30 2 * * 5"
  workflow_dispatch:
    inputs:
      reason:
        description: Optional note shown on the workflow run
        required: false
        default: ""
        type: string

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ "go" ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3.37.6
        with:
          languages: ${{ matrix.language }}

      - name: Build Application for Analysis
        run: |
          make build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3.37.6
